# GPU overlay for the RTX 5070 Ti (Blackwell, sm_120). Requires the NVIDIA
# Container Toolkit. Activate by setting in .env:
#   COMPOSE_FILE=docker-compose.yml:docker-compose.gpu.yml
# (or pass both -f flags manually), plus DEVICE=cuda.
#
# TTS deliberately stays on CPU: Kokoro-82M is faster than realtime there, and
# the 16 GB of VRAM is fully budgeted for qwen3:14b (~11 GB) + whisper
# large-v3 fp16 (~3 GB) + KV cache. Putting Kokoro on the GPU would evict them.
services:
  # keep Kokoro on CPU even when the global DEVICE=cuda (see header comment);
  # without this pin it inherits cuda from .env and refuses to start
  tts:
    environment:
      DEVICE: cpu

  asr:
    environment:
      DEVICE: cuda
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  llm:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
