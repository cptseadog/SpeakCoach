[project]
name = "speakcoach"
version = "0.1.0"
description = "Host-integration client for SpeakCoach (runs natively, not in Docker)"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "python-dotenv>=1.0",
    # M3: sounddevice, numpy, silero-vad, hotkey lib (Wayland-compatible)
]

[project.scripts]
speakcoach = "speakcoach.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["speakcoach"]
