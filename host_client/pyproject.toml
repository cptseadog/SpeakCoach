[project]
name = "speakcoach"
version = "0.1.0"
description = "Host-integration client for SpeakCoach (runs natively, not in Docker)"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "sounddevice>=0.5",   # needs system libportaudio2 (see install_host.sh)
    "soundfile>=0.12",
    "numpy>=1.26",
    # M3: silero-vad, hotkey lib (Wayland-compatible)
]

[project.scripts]
speakcoach = "speakcoach.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["speakcoach"]
